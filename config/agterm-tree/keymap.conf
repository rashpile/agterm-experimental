# agterm-tree — keymap binding. Append to ~/.config/agterm/keymap.conf, then `agtermctl keymap reload`.
#
# ctrl+b>z: quick-look file tree — toggles a tree-only nvim in the session's RIGHT split (the main
# pane is untouched). Selecting a file opens it in a 90% agterm overlay. Re-press hides the split but
# keeps nvim running, so the next press reveals the already-drawn tree with no relaunch flash.
command "Quick-look tree"        ctrl+b>z  $HOME/.config/agterm-projects/open-nvim-zed.sh "$AGT_SESSION_ID" "$AGT_SESSION_PWD"
