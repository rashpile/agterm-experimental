# recap — what happened lately in the claude running in THIS session, summarized by a local
# Ollama model (default gemma4:e4b) from the transcript's last 6 user turns. An 85% overlay
# shows the summary while it is written (~40 s for 6 turns), then the rendered markdown.
#
# The script is expected at ~/.config/agterm-projects/recap.sh, a symlink or a copy, with
# recap.py beside the real file.
#
# Joins the claude group under ctrl+b>c (s = summary; c>r is Clipboard review):
command "Session recap"           ctrl+b>c>s  $HOME/.config/agterm-projects/recap.sh "$AGT_SESSION_ID"
