# webmd — read the last claude message (or any markdown file) rendered, without leaving
# the terminal. webmd.sh renders markdown to a self-contained HTML page and shows it with
# terminal-browser, which draws a real Chromium into a terminal pane.
#
# The script is expected at ~/.config/agterm-projects/webmd.sh, with webmd-render.py beside
# it — adjust the paths below if you install it elsewhere.
#
# These join the existing claude group under ctrl+b>c, next to "Last message Typora"
# (ctrl+b>c>t), which does the same thing in a real editor window instead:
#   >w  the last message in a 95% overlay over this session (closes with the overlay)
#   >W  the last message in the session's RIGHT SPLIT PANE, creating or revealing that pane
#       as needed. A pane already running something is left alone; the page falls back to a
#       new session named "<this session> last", placed right after it. Either way it
#       persists, unlike the overlay. A pane webmd created closes again when the browser
#       quits, and gets two thirds of the width; a pane that already existed keeps its shell
#       and its divider. A pane already showing a webmd page is refreshed in place, so pressing
#       again shows the newer message without opening anything. opt+a is a second chord for the
#       same command, for when the leader
#       sequence is too slow. It costs the Option+A character (a-ring) inside agterm.
command "Last message webmd"          ctrl+b>c>w        $HOME/.config/agterm-projects/webmd.sh last "$AGT_SESSION_ID"
command "Last message webmd side"     ctrl+b>c>shift+w|opt+a  $HOME/.config/agterm-projects/webmd.sh last "$AGT_SESSION_ID" --side
