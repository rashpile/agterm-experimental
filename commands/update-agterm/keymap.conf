# Check for an agterm update: compare installed vs latest GitHub release; if behind, render the
# changelog for every newer release (via glow) and ask y/N before running `brew upgrade --cask agterm`.
# The script (update-agterm.sh) is expected at ~/.config/agterm-projects/update-agterm.sh — adjust the
# paths below if you install it elsewhere.
#
# Runs in a session inside the dedicated "processes" workspace (created on demand), NOT an overlay:
# an overlay auto-closes the instant its program exits, so a fast-failing script shows nothing, and the
# script's y/N + closing prompts need a persistent TTY. This depends on the "run-in-processes" helper
# (run-in-processes.sh) — install that command too, or swap the wrapper below for your own.
#   >u check for an agterm update (shows changelog, asks before upgrading)
command "Check AgTerm Update"     ctrl+b>u  $HOME/.config/agterm-projects/run-in-processes.sh "⬆ update" "zsh -lc $HOME/.config/agterm-projects/update-agterm.sh"
