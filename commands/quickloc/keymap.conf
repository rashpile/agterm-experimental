# Quick session locations (harpoon-style marks), slots 1-5. The mark IS the session name:
# slot N shows as a "[N]" tag prefix (e.g. "top" -> "[1] top"). Nested leader: ctrl+b then m
# then N marks the current session; ctrl+b>N jumps to it. The mark digit is modifier-free so
# nothing macOS-reserved or text-input can swallow it. Re-marking a slot moves the tag.
command "Mark location 1"        ctrl+b>m>1  $HOME/.config/agterm-projects/quickloc.sh set 1 "$AGT_SESSION_ID"
command "Mark location 2"        ctrl+b>m>2  $HOME/.config/agterm-projects/quickloc.sh set 2 "$AGT_SESSION_ID"
command "Mark location 3"        ctrl+b>m>3  $HOME/.config/agterm-projects/quickloc.sh set 3 "$AGT_SESSION_ID"
command "Mark location 4"        ctrl+b>m>4  $HOME/.config/agterm-projects/quickloc.sh set 4 "$AGT_SESSION_ID"
command "Mark location 5"        ctrl+b>m>5  $HOME/.config/agterm-projects/quickloc.sh set 5 "$AGT_SESSION_ID"
command "Go to location 1"       ctrl+b>1        $HOME/.config/agterm-projects/quickloc.sh go 1
command "Go to location 2"       ctrl+b>2        $HOME/.config/agterm-projects/quickloc.sh go 2
command "Go to location 3"       ctrl+b>3        $HOME/.config/agterm-projects/quickloc.sh go 3
command "Go to location 4"       ctrl+b>4        $HOME/.config/agterm-projects/quickloc.sh go 4
command "Go to location 5"       ctrl+b>5        $HOME/.config/agterm-projects/quickloc.sh go 5
