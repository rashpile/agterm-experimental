# Scratch files: create/open throwaway files in ~/.config/agterm-projects/scratches/, edited in a
# full-coverage agterm overlay via nvim. The script (scratch.sh) is expected at
# ~/.config/agterm-projects/scratch.sh — adjust the paths below if you install it elsewhere.
#
# cmd+shift+n is the built-in new_workspace default. A leader can't share a chord with a live binding,
# and a built-in can't itself be a leader — so we (1) move the new_workspace built-in OFF cmd+shift+n
# to a parking chord (hyper+n) to free the prefix, then (2) rebuild workspace-new as a custom command
# at >w. The parking chord still works but is really just there to vacate cmd+shift+n; use >w normally.
#   >n new scratch (pick type → scratch_<N>.<ext> → nvim, INSERT mode)   >o open a scratch (fzf → nvim)
#   >l reopen last scratch (no picker)                                   >w new workspace
map cmd+ctrl+opt+shift+n         new_workspace
command "New Scratch File"       cmd+shift+n>n  /opt/homebrew/bin/agtermctl session overlay open "zsh -ic '$HOME/.config/agterm-projects/scratch.sh new'" --target "$AGT_SESSION_ID" --size-percent 85
command "Open Scratch File"      cmd+shift+n>o  /opt/homebrew/bin/agtermctl session overlay open "zsh -ic '$HOME/.config/agterm-projects/scratch.sh open'" --target "$AGT_SESSION_ID" --size-percent 85
command "Last Scratch File"      cmd+shift+n>l  /opt/homebrew/bin/agtermctl session overlay open "zsh -ic '$HOME/.config/agterm-projects/scratch.sh last'" --target "$AGT_SESSION_ID" --size-percent 85
command "New workspace"          cmd+shift+n>w  /opt/homebrew/bin/agtermctl workspace new
