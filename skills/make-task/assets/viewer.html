<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>make-task</title>
<!--
  make-task viewer: the run's artifacts in tabs Design · Plan · Progress · Review · Stats.
  mt init writes one copy per tab into the run directory, viewer-<tab>.html, differing only in
  <body data-tab>, the tab shown first. The dashboard opens one with
  {html, cwd: <run>, javascript: true, sizePercent: 85, follow: true}.
  The page reads what mt writes and changes nothing. A javascript page cannot fetch() file:// URLs,
  but a <script src> beside the page loads, so it re-injects state.js (`window.mtState(<json>)`) and
  the current tab's artifacts/<id>.js (`window.mtArtifact("<id>", {...})`) every 1.5 s.
  A tab re-renders only when its payload's `updated` changed, or what else it shows did: the Plan tab
  joins the payload's checklist items with the state's tasks, the Progress tab has its filter, the
  Review tab the round picked in its strip and whether the live round went quiet for 30 s. Scroll
  positions, expanded items, the filter and the picked round live in this script (never read back from
  the DOM), so a re-render keeps them.
  Document HTML is mt's markdown-it output with raw HTML off and goes in as HTML; every other string
  is escaped. Colors come only from the --agterm-* variables agterm injects (never declared here).
-->
<style>
  .page {
    --bg: var(--agterm-background, #1d2021);
    --fg: var(--agterm-foreground, #ebdbb2);
    --dim: color-mix(in srgb, var(--fg) 58%, transparent);
    --faint: color-mix(in srgb, var(--fg) 14%, transparent);
    --wash: color-mix(in srgb, var(--fg) 5%, transparent);
    --run: var(--agterm-color-4, #83a598);
    --ok: var(--agterm-color-2, #b8bb26);
    --warn: var(--agterm-color-3, #fabd2f);
    --bad: var(--agterm-color-1, #fb4934);
    --you: var(--agterm-color-5, #d3869b);
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--agterm-background, #1d2021);
    color: var(--agterm-foreground, #ebdbb2);
    font: 14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .page { padding: 22px 28px 18px; max-width: 1080px; margin: 0 auto; }
  code { font-family: var(--mono); font-size: 12px; }
  .empty { color: var(--dim); font-size: 12.5px; }

  /* header, as in the dashboard */
  header h1 {
    font: 600 21px/1.2 -apple-system, "SF Pro Display", system-ui, sans-serif;
    letter-spacing: -0.01em; margin: 0 0 6px; overflow-wrap: anywhere;
  }
  .where { color: var(--dim); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
  .where code { color: var(--fg); }
  .where .tree { color: var(--run); }

  /* tabs: the dashboard's file buttons, the current one framed */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--faint); }
  .file {
    font: inherit; font-size: 12.5px; color: var(--fg); background: var(--wash); cursor: pointer;
    border: 1px solid var(--faint); border-radius: 6px; padding: 3px 11px;
  }
  .file:hover { border-color: var(--run); }
  .file:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
  .file .ago { color: var(--dim); font-size: 11.5px; margin-left: 6px; }
  .file .live { color: var(--run); font-size: 11.5px; margin-left: 6px; }
  .file .live::before { content: "●"; margin-right: 3px; }
  .file.none { color: var(--dim); border-style: dashed; background: none; }
  .file.cur { border-color: var(--run); background: color-mix(in srgb, var(--run) 16%, transparent); font-weight: 600; color: var(--fg); border-style: solid; }

  .pane { padding-top: 16px; }
  details.more > summary { color: var(--dim); font-size: 12.5px; cursor: pointer; margin: 8px 0; }
  pre.raw {
    margin: 0; padding: 10px 12px; border: 1px solid var(--faint); border-radius: 6px; background: var(--wash);
    font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* status band, as in the dashboard: icon, text, then whatever the tab puts after it */
  .now {
    margin: 0 0 14px; padding: 10px 12px; border-radius: 8px;
    background: color-mix(in srgb, var(--run) 12%, transparent);
    display: grid; grid-auto-flow: column; grid-template-columns: auto 1fr; grid-auto-columns: auto; gap: 12px; align-items: center;
  }
  .now .text { font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
  .now .sub { display: block; color: var(--dim); font-weight: 400; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .clock, .now .fresh { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
  .now .fresh.stale { color: var(--warn); }
  .now.done { background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .now.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .now.error { background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .warnline {
    margin: 0 0 12px; padding-left: 10px; font-size: 12.5px; overflow-wrap: anywhere;
    border-left: 2px solid color-mix(in srgb, var(--warn) 70%, transparent);
  }

  /* section headings outside the rendered document */
  h2.sect { font-size: 13px; font-weight: 600; margin: 18px 0 8px; color: var(--dim); display: flex; gap: 10px; align-items: baseline; }
  h2.sect:first-child { margin-top: 0; }
  h2.sect .count { font-weight: 500; }
  h2.sect .aside { margin-left: auto; font-weight: 400; font-size: 12px; overflow-wrap: anywhere; }

  /* rounds strip, and the Progress filters in the same chips */
  .rounds { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .rchip { font-size: 12px; border: 1px solid var(--faint); border-radius: 6px; padding: 2px 9px; color: var(--dim); background: none; }
  .rchip b { color: var(--fg); font-weight: 600; margin-right: 6px; }
  .rchip.cur { border-color: var(--run); color: var(--fg); background: color-mix(in srgb, var(--run) 10%, transparent); }
  button.rchip { font: inherit; font-size: 12px; cursor: pointer; }
  button.rchip:hover { border-color: var(--run); }
  button.rchip:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }

  /* Plan: the dashboard's task rows, each one's checklist folded under it */
  .rows { list-style: none; margin: 0; padding: 0; }
  .task { border-bottom: 1px solid color-mix(in srgb, var(--fg) 6%, transparent); }
  .trow { position: relative; padding: 5px 0 5px 18px; display: grid; grid-template-columns: 1fr auto 60px; gap: 12px; align-items: baseline; }
  summary.trow { cursor: pointer; list-style: none; }
  summary.trow::-webkit-details-marker { display: none; }
  summary.trow:hover .k { color: var(--fg); }
  .task .dot { position: absolute; left: 0; top: 11px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--faint); }
  .task.done .dot { border-color: var(--ok); background: var(--ok); }
  .task.run .dot { border-color: var(--run); background: var(--run); }
  .task .t { min-width: 0; overflow-wrap: anywhere; }
  .task.pending .t { color: var(--dim); }
  .task.run .t { font-weight: 600; }
  .task .k { color: var(--dim); margin-right: 6px; }
  .bar { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
  .bar i { display: block; width: 84px; height: 5px; border-radius: 3px; background: var(--faint); overflow: hidden; }
  .bar i b { display: block; height: 100%; background: var(--run); }
  .task.done .bar i b { background: var(--ok); }
  .dur { color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; }
  .dur.live { color: var(--run); }
  .checks { list-style: none; margin: 2px 0 8px 18px; padding: 0 0 0 14px; border-left: 2px solid color-mix(in srgb, var(--run) 50%, transparent); }
  .checks li { font-size: 13px; padding: 1px 0; overflow-wrap: anywhere; }
  .checks li::before { content: "○"; color: var(--dim); margin-right: 8px; }
  .checks li.x { color: var(--dim); }
  .checks li.x::before { content: "✓"; color: var(--ok); }
  .checks code { background: var(--wash); padding: 1px 5px; border-radius: 4px; }

  /* Progress: the timeline, decisions, deviations and review lines marked */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .loghead { color: var(--dim); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 10px; }
  .loghead code { color: var(--fg); }
  .tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
  .tl > li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; }
  .tl time { color: var(--dim); font-family: var(--mono); font-size: 11.5px; padding-top: 1px; }
  .tl .line { min-width: 0; overflow-wrap: anywhere; }
  .tl .sec { font-weight: 600; font-size: 12.5px; margin: 12px 0 0; padding-top: 6px; border-top: 1px solid var(--faint); }
  .tl .sec:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .tl .sec span { overflow-wrap: anywhere; }
  .tl .mark { display: block; padding-left: 10px; border-left: 2px solid var(--m); }
  .tl .dec { --m: color-mix(in srgb, var(--warn) 70%, transparent); }
  .tl .dev { --m: color-mix(in srgb, var(--you) 75%, transparent); }
  .tl .rev { --m: color-mix(in srgb, var(--run) 70%, transparent); }
  .tl .tag { font-size: 11px; font-weight: 600; margin-right: 6px; }
  .tl .dec .tag { color: var(--warn); }
  .tl .dev .tag { color: var(--you); }
  .tl .rev .tag { color: var(--run); }
  .tl .kids { list-style: none; margin: 2px 0 0; padding: 0 0 0 12px; color: var(--dim); font-size: 12.5px; }
  .tl .kids li::before { content: "–"; margin-right: 6px; }

  /* Review: the stage steps (the dashboard's rail laid horizontally), agents by stage, findings */
  .stages { display: flex; margin: 4px 0 16px; }
  .stage { flex: 1; min-width: 0; position: relative; padding: 0 8px 0 22px; }
  .stage::after { content: ""; position: absolute; left: 18px; right: 4px; top: 6px; height: 2px; background: var(--faint); margin-left: 4px; }
  .stage:last-child::after { display: none; }
  .stage.done::after { background: color-mix(in srgb, var(--ok) 55%, transparent); }
  .node { position: absolute; left: 0; top: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--faint); background: var(--bg); z-index: 1; }
  .done > .node { border-color: var(--ok); background: var(--ok); }
  .run > .node { border-color: var(--run); background: var(--run); animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--run) 60%, transparent); }
    100% { box-shadow: 0 0 0 9px transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .run > .node { animation: none; } }
  .stage .sn { font-weight: 600; font-size: 13.5px; position: relative; z-index: 1; background: var(--bg); padding-right: 6px; }
  .stage.pending .sn { color: var(--dim); font-weight: 500; }
  .stage .sd { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .stage.run .sd { color: var(--run); }

  .cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 26px; }
  .cols > div { min-width: 0; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .group { color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 2px; }
  .group:first-child { margin-top: 0; }
  .row {
    position: relative; padding: 5px 0 5px 18px; display: grid; grid-template-columns: minmax(0, 150px) 1fr auto 60px;
    gap: 12px; align-items: baseline; border-bottom: 1px solid color-mix(in srgb, var(--fg) 6%, transparent);
  }
  .row .dot { position: absolute; left: 0; top: 11px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--faint); }
  .row.done .dot { border-color: var(--ok); background: var(--ok); }
  .row.run .dot { border-color: var(--run); background: var(--run); }
  .row.warn .dot { border-color: var(--warn); background: var(--warn); }
  .row .name { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
  .row.run .name { font-weight: 600; }
  .row .lens { color: var(--dim); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
  .row .state { font-size: 12px; }
  .row.run .state { color: var(--run); }
  .row.warn .state { color: var(--warn); }
  .row .act { grid-column: 2 / -1; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -2px; }

  .sev { padding: 0 6px; border-radius: 4px; font-size: 12px; white-space: nowrap; }
  .sev.critical { background: color-mix(in srgb, var(--bad) 25%, transparent); }
  .sev.major { background: color-mix(in srgb, var(--warn) 22%, transparent); }
  .sev.minor { background: var(--wash); color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .finding { border-left: 2px solid var(--faint); padding: 6px 0 6px 12px; margin: 0 0 6px; }
  .finding.critical { border-left-color: color-mix(in srgb, var(--bad) 75%, transparent); }
  .finding.major { border-left-color: color-mix(in srgb, var(--warn) 70%, transparent); }
  .finding summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: baseline; }
  .finding summary::-webkit-details-marker { display: none; }
  .finding summary .title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .finding.minor summary .title { font-weight: 500; }
  .finding summary .meta { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .finding .loc, .finding .note { grid-column: 2 / -1; color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .finding .loc code { color: var(--fg); }
  .finding .note { color: var(--warn); }
  .finding .body { margin: 8px 0 2px; color: color-mix(in srgb, var(--fg) 86%, transparent); max-width: 80ch; white-space: pre-wrap; overflow-wrap: anywhere; }
  .finding .fix { margin-top: 6px; padding: 6px 10px; border-radius: 6px; background: var(--wash); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .finding .fix b { color: var(--ok); font-weight: 600; margin-right: 6px; }

  footer.paths {
    margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--faint);
    display: flex; gap: 16px; flex-wrap: wrap; color: var(--dim); font-size: 11.5px; overflow-wrap: anywhere;
  }
  footer.paths .safe { margin-left: auto; color: var(--ok); }

  /* the document beside its table of contents */
  .docwrap { display: flex; gap: 28px; align-items: flex-start; }
  .doc { flex: 1; min-width: 0; max-width: 78ch; overflow-wrap: anywhere; }
  .toc { flex: none; width: 190px; position: sticky; top: 12px; font-size: 12.5px; }
  .toc a { display: block; color: var(--dim); text-decoration: none; padding: 2px 0; }
  .toc a.l3 { padding-left: 12px; }
  .toc a:hover { color: var(--fg); }
  @media (max-width: 760px) { .toc { display: none; } }

  /* rendered markdown in the theme, as in doc.html */
  .doc h1 { font: 600 20px/1.25 -apple-system, "SF Pro Display", system-ui, sans-serif; margin: 4px 0 12px; }
  .doc h2 { font-size: 16px; font-weight: 600; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--faint); }
  .doc h3 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  .doc h4, .doc h5, .doc h6 { font-size: 13.5px; font-weight: 600; margin: 14px 0 6px; color: var(--dim); }
  .doc [id] { scroll-margin-top: 12px; }
  .doc p, .doc ul, .doc ol { margin: 0 0 10px; }
  .doc li { margin: 2px 0; }
  .doc li > ul, .doc li > ol { margin: 2px 0 0; }
  .doc a { color: var(--run); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .doc a:hover { text-decoration-color: var(--run); }
  .doc code { background: var(--wash); padding: 1px 5px; border-radius: 4px; }
  .doc pre { background: var(--wash); border: 1px solid var(--faint); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 0 0 12px; }
  .doc pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; overflow-wrap: normal; }
  .doc table { border-collapse: collapse; margin: 0 0 12px; font-size: 13px; display: block; overflow-x: auto; }
  .doc th, .doc td { border: 1px solid var(--faint); padding: 4px 10px; text-align: left; vertical-align: top; }
  .doc th { background: var(--wash); font-weight: 600; }
  .doc blockquote { margin: 0 0 10px; padding: 2px 12px; border-left: 3px solid var(--faint); color: var(--dim); }
  .doc hr { border: 0; border-top: 1px solid var(--faint); margin: 18px 0; }
  .doc img { max-width: 100%; }
  .doc s { color: var(--dim); }
  .doc .contains-task-list { list-style: none; padding-left: 4px; }
  .doc .contains-task-list .contains-task-list { padding-left: 22px; }
  .doc .task-list-item-checkbox { margin: 0 8px 0 0; vertical-align: -1px; accent-color: var(--ok); }
  .doc .footnote-ref a { text-decoration: none; font-size: 11px; }
  .doc .footnotes-sep { margin: 22px 0 10px; }
  .doc .footnotes { color: var(--dim); font-size: 13px; }
  .doc .footnotes-list { padding-left: 22px; }
  .doc .footnote-backref { text-decoration: none; }
</style>
</head>
<body data-tab="design">
<main class="page" id="app">
  <header id="head"><p class="empty">Loading run state…</p></header>
  <section class="pane" id="pane"></section>
</main>
<script>
(function () {
  const TABS = [['design', 'Design'], ['plan', 'Plan'], ['progress', 'Progress log'], ['review', 'Review'], ['stats', 'Stats']];
  const LABEL = Object.fromEntries(TABS);
  const app = document.getElementById('app'), head = document.getElementById('head'), pane = document.getElementById('pane');
  let cur = LABEL[document.body.dataset.tab] ? document.body.dataset.tab : 'design';
  let state = null, stateText = null, stateNote = 'Loading run state…';
  const payloads = {};      // id -> the last payload loaded
  const missing = new Set(); // ids whose script did not load and that have no payload yet
  const scrolls = {};       // tab -> its scroll position when it was left
  const open = new Map();   // items the user expanded or collapsed, "<tab>:<key>" -> open
  const openFirst = {};     // "<tab>:<key>" -> open until the user toggles it, as last rendered
  let filter = 'all';       // the Progress tab's filter
  let shown = null;         // what the pane shows, "<tab>|<what>": it is rewritten only when this changes

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = x => { const n = Number(x); return Number.isFinite(n) ? n : 0; };
  const list = x => Array.isArray(x) ? x : [];
  const nowSec = () => Date.now() / 1000;
  const ago = t => { if (!t) return ''; const d = nowSec() - num(t); return d < 60 ? 'now' : d < 3600 ? `${Math.floor(d / 60)}m` : `${Math.floor(d / 3600)}h`; };
  // after the run, "Nm ago" keeps growing and says nothing; show when the artifact was last updated instead
  const pad2 = n => String(n).padStart(2, '0');
  const stamp = t => { if (!t) return ''; const d = new Date(num(t) * 1000), hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    return d.toDateString() === new Date().toDateString() ? hm : `${d.getDate()} ${d.toLocaleString('en', { month: 'short' })} ${hm}`; };
  const fmtDur = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return h ? `${h}h ${m}m` : m ? `${m}m ${pad2(x)}s` : `${x}s`; };

  const artifact = id => list(state && state.artifacts).find(x => x.id === id);

  // as in the dashboard: finished items show how long they took, running ones carry data-since and tick
  // every second; one the run left running shows its time up to the run's end
  function dur(item) {
    if (!item || !item.started) return '<span class="dur"></span>';
    const end = item.finished || (state && state.finished);
    if (end) return `<span class="dur">${fmtDur(num(end) - num(item.started))}</span>`;
    return `<span class="dur live" data-since="${num(item.started)}">${fmtDur(nowSec() - num(item.started))}</span>`;
  }

  // the round the Review tab follows live, as mt's live_round: the highest-numbered one, when it has
  // started, has no result, its milestone is not `failed`, and the run is not finished
  function liveRound(s) {
    const rounds = list(s && s.review);
    if (!rounds.length || s.finished) return null;
    const last = rounds.reduce((a, b) => (num(b.round) > num(a.round) ? b : a));
    return last.started && !last.finished && last.milestone !== 'failed' ? last.round : null;
  }

  function badge(id) {
    const tasks = list(state.tasks);
    if (id === 'review' && liveRound(state) != null) return '<span class="live">live</span>';
    if (id === 'plan' && tasks.length) return `<span class="ago">${tasks.filter(t => t.status === 'done').length} / ${tasks.length}</span>`;
    const a = artifact(id);
    if (!a || !num(a.updated)) return '<span class="ago">—</span>';
    return state.finished ? `<span class="ago">${esc(stamp(a.updated))}</span>`
                          : `<span class="ago" data-ago="${num(a.updated)}">${ago(a.updated)}</span>`;
  }

  function tabButton([id, label]) {
    const a = artifact(id), here = id === cur;
    const cls = `file${here ? ' cur' : ''}${a ? '' : ' none'}`;
    return `<button type="button" class="${cls}" data-show="${id}"${here ? ' aria-current="page"' : ''}` +
      ` title="${esc(a ? (a.hint || a.source || '') : 'not yet')}">${esc(label)}${badge(id)}</button>`;
  }

  function renderHead() {
    if (!state) { head.innerHTML = `<p class="empty">${esc(stateNote)}</p>`; return; }
    const s = state;
    const profileSpans = (s.profile_name ? `<span>profile <code>${esc(s.profile_name)}</code></span>` : '') +
      (s.autonomy ? `<span>autonomy <code>${esc(s.autonomy)}</code></span>` : '');
    head.innerHTML = `<h1>${esc(s.title)}</h1>
      <div class="where"><span><code>${esc(s.repo)}</code></span><span>branch <code>${esc(s.branch || '—')}</code></span>
        ${s.worktree ? '<span class="tree">worktree</span>' : '<span>in place</span>'}${profileSpans}</div>
      <nav class="tabs">${TABS.map(tabButton).join('')}</nav>`;
  }

  // an item the user can expand, closed (or `first`) until the user toggles it; the toggle is kept in
  // `open`, so a re-render keeps it
  const isOpen = k => (open.has(k) ? open.get(k) : !!openFirst[k]);
  function fold(key, summary, inner, { first = false, cls = 'more', sumCls = '' } = {}) {
    const k = `${cur}:${key}`;
    openFirst[k] = first;
    return `<details class="${cls}"${isOpen(k) ? ' open' : ''}>` +
      `<summary${sumCls ? ` class="${sumCls}"` : ''} data-fold="${esc(key)}">${summary}</summary>${inner}</details>`;
  }

  function docView(p) {
    const toc = list(p.toc);
    const nav = toc.length
      ? `<nav class="toc">${toc.map(t => `<a class="l${num(t.level)}" href="#${esc(t.id)}">${esc(t.text)}</a>`).join('')}</nav>` : '';
    return `<div class="docwrap"><article class="doc">${String(p.html || '')}</article>${nav}</div>`;
  }

  // Plan: the state's tasks (status, counts, times) with the payload's checklist items by task n; the
  // running task's checklist is open until the user closes it
  function taskRow(t, items) {
    const done = num(t.done), total = num(t.total), pct = total ? Math.round(100 * done / total) : 0;
    const status = esc(t.status || 'pending');
    const row = `<span class="dot"></span><span class="t"><span class="k">${esc(t.n)}</span>${esc(t.title)}</span>` +
      `<span class="bar">${done}/${total}<i><b style="width:${pct}%"></b></i></span>${dur(t)}`;
    if (!items.length) return `<li class="task ${status}"><div class="trow">${row}</div></li>`;
    // item html is mt's render_inline output (raw HTML off); the text is escaped when there is none
    const checks = items.map(i => `<li${i.checked ? ' class="x"' : ''}>${i.html != null ? String(i.html) : esc(i.text)}</li>`);
    return `<li class="task ${status}">` +
      fold(`task:${t.n}`, row, `<ul class="checks">${checks.join('')}</ul>`, { first: t.status === 'run', cls: 'tfold', sumCls: 'trow' }) +
      '</li>';
  }

  function planView(p) {
    const tasks = list(state && state.tasks);
    const items = p.items && typeof p.items === 'object' ? p.items : {};
    let band = '';
    if (tasks.length) {
      const running = tasks.find(t => t.status === 'run');
      const done = tasks.filter(t => t.status === 'done').length, all = done === tasks.length;
      const checked = tasks.reduce((n, t) => n + num(t.done), 0), boxes = tasks.reduce((n, t) => n + num(t.total), 0);
      const text = running ? `Task ${esc(running.n)} of ${tasks.length} · ${esc(running.title)}`
        : all ? `All ${tasks.length} tasks done` : `${done} of ${tasks.length} tasks done`;
      band = `<div class="now${all ? ' done' : ''}"><span>${all ? '✓' : '▸'}</span><span class="text">${text}</span>` +
        `<span class="clock">${checked} of ${boxes} checks</span></div>`;
    }
    const a = artifact('plan'), src = (a && (a.hint || a.source)) || p.source;
    const rows = tasks.length
      ? `<ul class="rows">${tasks.map(t => taskRow(t, list(items[String(t.n)]))).join('')}</ul>`
      : '<p class="empty">No task sections in the plan yet.</p>';
    return `${band}<h2 class="sect">Tasks <span class="count">${tasks.length}</span>` +
      `${src ? `<span class="aside"><code>${esc(src)}</code></span>` : ''}</h2>${rows}` +
      fold('doc', 'Show the plan document', docView(p));
  }

  // Progress: the log's entries newest first, each one's lines in file order; every string is escaped
  const FILTERS = [['all', 'All'], ['decision', 'Decisions'], ['deviation', 'Deviations'], ['review', 'Review']];
  const MARK = { decision: 'dec', deviation: 'dev', review: 'rev' };

  function timeCell(at) {
    if (!at) return '<time></time>';
    const m = /(\d{2}:\d{2}:\d{2})$/.exec(String(at));
    return `<time title="${esc(at)}">${esc(m ? m[1] : at)}</time>`;
  }

  function progressLine(l) {
    let body = esc(l.text);
    if (MARK[l.kind]) {
      // a review line's tag is what names the round: "review round 3 (final): …" -> "round 3 (final)"
      let tag = l.kind, text = String(l.text ?? '');
      const m = l.kind === 'review' && /^review (.+?):\s+([\s\S]*)$/.exec(text);
      if (m) { tag = m[1]; text = m[2]; }
      body = `<span class="mark ${MARK[l.kind]}"><span class="tag">${esc(tag)}</span>${esc(text)}</span>`;
    }
    const kids = list(l.children);
    const sub = kids.length ? `<ul class="kids">${kids.map(c => `<li>${esc(c && c.text)}</li>`).join('')}</ul>` : '';
    return `<li>${timeCell(l.at)}<div class="line">${body}${sub}</div></li>`;
  }

  function entryTitle(e) {
    if (e.task != null) return `Task ${e.task}${e.title ? ` · ${e.title}` : ''}`;
    return e.title || 'Log';
  }

  function progressView(p) {
    const entries = list(p.entries);
    if (!entries.length) return p.raw ? `<pre class="raw">${esc(p.raw)}</pre>` : '<p class="empty">The progress log is empty.</p>';
    const header = p.header && typeof p.header === 'object' ? Object.entries(p.header) : [];
    const meta = header.length
      ? `<div class="loghead">${header.map(([k, v]) => `<span>${esc(k)} <code>${esc(v)}</code></span>`).join('')}</div>` : '';
    const lines = entries.flatMap(e => list(e.lines));
    const count = k => (k === 'all' ? lines.length : lines.filter(l => l.kind === k).length);
    const chips = FILTERS.map(([k, label]) => `<button type="button" class="rchip${k === filter ? ' cur' : ''}" data-filter="${k}"` +
      ` aria-pressed="${k === filter}"><b>${label}</b>${count(k)}</button>`).join('');
    const rows = entries.slice().reverse().map(e => {
      const keep = list(e.lines).filter(l => filter === 'all' || l.kind === filter);
      if (filter !== 'all' && !keep.length) return '';
      return `<li class="sec">${timeCell(e.at)}<span>${esc(entryTitle(e))}</span></li>${keep.map(progressLine).join('')}`;
    }).join('');
    const none = `<p class="empty">No ${esc(FILTERS.find(f => f[0] === filter)[1].toLowerCase())} logged.</p>`;
    return `${meta}<div class="filters">${chips}</div>${rows ? `<ol class="tl">${rows}</ol>` : none}`;
  }

  // Review: the rounds strip, then one round: the live one as its events.jsonl shows it (stages, agents,
  // findings so far), a finished one with its verdict and final findings, or one that failed. The strip
  // follows the live round, else the latest; a click on another round keeps that one shown until the
  // user clicks the followed round again. Every finding, agent and activity string is escaped.
  const SEVS = ['critical', 'major', 'minor'];
  const GATING = ['critical', 'major'];
  const FINISHED = ['done', 'degraded'];
  const NOTES = ['agent_retried', 'agent_degraded', 'rate_limit'];
  const KEPT = /^(\d+) of (\d+) kept\b/;
  const STALE = 30;        // seconds without news from the live round before the tab warns
  let pinned = null;       // the round the user picked in the strip; null follows the live or latest one

  const obj = x => !!x && typeof x === 'object';
  const plural = (n, one) => `${n} ${one}${n === 1 ? '' : 's'}`;
  const upper = s => { s = String(s ?? ''); return s.charAt(0).toUpperCase() + s.slice(1); };
  const roundList = p => list(p && p.rounds).filter(obj).sort((a, b) => num(a.round) - num(b.round));
  // a round the payload calls running is not followed once the run has ended (mt's live_round)
  const roundStatus = r => (r.state === 'done' ? 'done'
    : r.state === 'running' && !(state && state.finished) ? 'running' : 'failed');
  function followed(rs) { const live = rs.find(r => roundStatus(r) === 'running'); return (live || rs[rs.length - 1]).round; }
  function pickRound(rs) {
    const n = pinned != null && rs.some(r => r.round === pinned) ? pinned : followed(rs);
    return rs.find(r => r.round === n);
  }
  // how much of the live round there is to show: live, starting (no event yet), truncated, format (unread)
  function liveMode(r) {
    const live = r.live;
    if (!obj(live)) return 'starting';
    if (live.truncated) return 'truncated';
    if (live.format_ok === false) return 'format';
    return num(live.events) ? 'live' : 'starting';
  }
  // the live round's latest news: its latest event, or its start before the first one
  const newsAt = r => num(obj(r.live) && r.live.updated) || num(r.started);
  const stale = r => roundStatus(r) === 'running' && ['live', 'starting'].includes(liveMode(r)) &&
    newsAt(r) > 0 && nowSec() - newsAt(r) > STALE;
  const ticking = t => `<span data-since="${num(t)}">${fmtDur(nowSec() - num(t))}</span>`;

  function roundChip(r, here) {
    const st = roundStatus(r), c = obj(r.counts) ? r.counts : {};
    const text = st === 'done'
      ? [...SEVS.filter(k => num(c[k])).map(k => `${num(c[k])} ${k}`), r.verdict || 'done'].join(' · ')
      : [r.run, st === 'running' ? 'live' : 'failed'].filter(Boolean).join(' · ');
    return `<button type="button" class="rchip${here ? ' cur' : ''}" data-round="${num(r.round)}" aria-pressed="${here}">` +
      `<b>Round ${esc(r.round)}</b>${esc(text)}</button>`;
  }

  // the band's text is HTML its caller escaped
  const band = (cls, icon, text, ...tail) =>
    `<div class="now${cls ? ` ${cls}` : ''}"><span>${icon}</span><span class="text">${text}</span>${tail.join('')}</div>`;
  const clock = t => (num(t) ? `<span class="clock" data-since="${num(t)}">${fmtDur(nowSec() - num(t))}</span>` : '');
  function fresh(r) {
    const t = newsAt(r);
    return t ? `<span class="fresh${stale(r) ? ' stale' : ''}">updated ${ticking(t)} ago</span>` : '';
  }
  const staleLine = r => (stale(r)
    ? `<p class="warnline">No update for ${ticking(newsAt(r))}: what follows may be out of date. The review goes on.</p>` : '');

  function stageSteps(live) {
    const agents = list(live.agents).filter(obj), stages = list(live.stages).filter(obj);
    if (!stages.length) return '';
    const steps = stages.map((s, i) => {
      const mine = agents.filter(a => a.stage === s.name);
      const doneN = mine.filter(a => FINISHED.includes(a.state)).length;
      const over = s.finished != null || i < stages.length - 1;
      const parts = [over || doneN === mine.length ? plural(mine.length, 'agent') : `${doneN} of ${mine.length} agents done`];
      if (s.name === 'synthesis' && live.merged) {
        parts.push(`${num(live.found)} → ${num(live.total)}`);
        if (num(live.dropped_total)) parts.push(`${num(live.dropped_total)} dropped`);
      } else if (mine.some(a => a.findings != null)) {
        parts.push(plural(mine.reduce((n, a) => n + num(a.findings), 0), 'finding'));
      }
      const kept = mine.map(a => KEPT.exec(String(a.result || ''))).filter(Boolean);
      if (kept.length) parts.push(`${kept.reduce((n, m) => n + Number(m[1]), 0)} of ${kept.reduce((n, m) => n + Number(m[2]), 0)} kept`);
      const took = !num(s.started) ? '' : s.finished != null ? ` · ${fmtDur(num(s.finished) - num(s.started))}`
        : over ? '' : ` · ${ticking(s.started)}`;
      return `<div class="stage ${over ? 'done' : 'run'}"><span class="node"></span><span class="sn">${esc(upper(s.name) || 'Stage')}</span>` +
        `<span class="sd">${esc(parts.join(' · '))}${took}</span></div>`;
    });
    // every stage over: revmux is writing its report, which `mt review result` records
    const last = stages[stages.length - 1], waiting = last.finished != null;
    steps.push(`<div class="stage ${waiting ? 'run' : 'pending'}"><span class="node"></span><span class="sn">Result</span>` +
      `<span class="sd">${waiting ? 'waiting for the report' : 'verdict and final findings'}</span></div>`);
    return `<div class="stages">${steps.join('')}</div>`;
  }

  function agentRow(a) {
    const st = String(a.state || 'running'), retries = num(a.retries);
    const warn = ['retrying', 'rate-limited', 'degraded'].includes(st) || retries > 0;
    let what = st === 'done' ? (a.result || 'done') : st === 'rate-limited' ? 'rate limited' : st;
    if (retries) what += ` · retried ${retries === 1 ? 'once' : `${retries} times`}`;
    // a running agent shows what it does; one that was retried, rate limited or degraded, why
    const note = list(a.recent).filter(x => obj(x) && NOTES.includes(x.kind)).pop();
    const act = st === 'running' ? [a.progress, a.activity].filter(Boolean).join(' · ') : warn && note ? note.text : '';
    const lens = [a.lenses, a.model].filter(Boolean).join(' · ');
    return `<li class="row ${warn ? 'warn' : st === 'done' ? 'done' : 'run'}"><span class="dot"></span>` +
      `<span class="name">${esc(a.name)}</span><span class="lens">${esc(lens)}</span><span class="state">${esc(what)}</span>` +
      `${dur(a)}${act ? `<span class="act">${esc(act)}</span>` : ''}</li>`;
  }

  // agents under the stage they started in, the latest stage first
  function agentList(live) {
    const agents = list(live.agents).filter(obj);
    if (!agents.length) return '<h2 class="sect">Agents</h2><p class="empty">No agent started yet.</p>';
    const order = [...new Set([...list(live.stages).filter(obj).map(s => s.name).reverse(), ...agents.map(a => a.stage)])];
    const busy = agents.filter(a => !FINISHED.includes(a.state)).length;
    const rows = order.map(g => {
      const mine = agents.filter(a => a.stage === g);
      return mine.length ? `<li class="group">${esc(upper(g) || 'Before the first stage')}</li>${mine.map(agentRow).join('')}` : '';
    }).join('');
    return `<h2 class="sect">Agents <span class="count">${agents.length}</span>` +
      `<span class="aside">${busy} running · ${agents.length - busy} done</span></h2><ul class="rows">${rows}</ul>`;
  }

  function where(f) {
    let s = String(f.file || '');
    if (s && num(f.line)) s += `:${num(f.line)}${num(f.end_line) && num(f.end_line) !== num(f.line) ? `-${num(f.end_line)}` : ''}`;
    return s;
  }

  // one finding, its body and fix behind its summary; a critical one is open until the user closes it.
  // kind: f (a finding), q (an open question), d (dropped); marks: id -> what the result says of it
  function findingView(r, f, kind, marks = {}) {
    const sev = String(f.severity || ''), cls = SEVS.includes(sev) ? sev : 'minor';
    const who = list(f.sources).length ? list(f.sources).join(', ') : f.agent;
    const meta = [num(f.confidence) ? `conf ${num(f.confidence)}` : '', f.verdict].filter(Boolean).join(' · ');
    const loc = [where(f) ? `<code>${esc(where(f))}</code>` : '', esc(who), esc(f.id)].filter(Boolean).join(' · ');
    const mark = marks[f.id];
    const summary = `<span class="sev ${cls}">${esc(kind === 'q' ? 'question' : sev || 'finding')}</span>` +
      `<span class="title">${esc(f.title || f.id || 'Untitled finding')}</span><span class="meta">${esc(meta)}</span>` +
      `${loc ? `<span class="loc">${loc}</span>` : ''}${mark ? `<span class="note">${esc(mark)}</span>` : ''}`;
    const inner = (f.body ? `<div class="body">${esc(f.body)}</div>` : '') +
      (f.fix ? `<div class="fix"><b>fix</b>${esc(f.fix)}</div>` : '');
    return fold(`r${num(r.round)}:${kind}:${f.id}`, summary, inner || '<div class="body empty">No detail.</div>',
      { first: kind === 'f' && sev === 'critical', cls: `finding ${cls}` });
  }

  // critical and major findings in the open, the rest folded under one line
  function findingList(r, items, marks = {}) {
    const top = items.filter(f => GATING.includes(f.severity)), rest = items.filter(f => !GATING.includes(f.severity));
    let out = top.map(f => findingView(r, f, 'f', marks)).join('');
    if (rest.length) {
      const label = plural(rest.length, rest.every(f => f.severity === 'minor') ? 'minor finding' : 'more finding');
      out += fold(`r${num(r.round)}:f-rest`, esc(label), rest.map(f => findingView(r, f, 'f', marks)).join(''));
    }
    return out;
  }

  function sevChips(counts, extra = '') {
    const c = obj(counts) ? counts : {};
    const chips = SEVS.filter(k => num(c[k])).map(k => `<span class="sev ${k}">${num(c[k])} ${k}</span>`).join('') + extra;
    return chips ? `<div class="chips">${chips}</div>` : '';
  }

  function droppedList(r, total) {
    const items = list(r.dropped).filter(obj), n = Math.max(num(total), items.length);
    return n ? fold(`r${num(r.round)}:dropped`, `${n} dropped by synthesis`, items.map(f => findingView(r, f, 'd')).join('')) : '';
  }

  function paths(r, live) {
    const spans = [r.events, r.log].filter(Boolean).map(x => `<span><code>${esc(x)}</code></span>`);
    if (live) spans.push('<span class="safe">Closing this view does not stop the review</span>');
    return spans.length ? `<footer class="paths">${spans.join('')}</footer>` : '';
  }

  function runningView(r) {
    const mode = liveMode(r), start = clock(r.started);
    if (mode === 'truncated' || mode === 'format') {
      const why = mode === 'truncated' ? 'is larger than 8 MB' : 'holds no event this view can read';
      return band('', '▸', `Round ${esc(r.round)} · ${esc(r.milestone || 'running')}`, start) +
        `<p class="warnline">Live detail unavailable: <code>events.jsonl</code> ${why}. ` +
        'The round goes on; its result shows here once it is recorded.</p>' + paths(r, true);
    }
    if (mode === 'starting') {
      return band('', '▸', 'Starting revmux…', fresh(r), start) + staleLine(r) +
        '<p class="empty">Waiting for the first event of the round.</p>' + paths(r, true);
    }
    const live = r.live, agents = list(live.agents).filter(obj), stage = String(live.stage || '');
    const mine = agents.filter(a => a.stage === stage), doneN = mine.filter(a => FINISHED.includes(a.state)).length;
    let text = `${esc(upper(stage) || 'Review')} · ${mine.length ? `${doneN} of ${plural(mine.length, 'agent')} done` : 'starting'}`;
    const act = obj(live.activity) ? live.activity : null;
    if (act && act.text) text += `<span class="sub">${esc([act.agent, act.text].filter(Boolean).join(' · '))}</span>`;
    const findings = list(live.findings).filter(obj), total = Math.max(num(live.total), findings.length);
    const aside = [live.merged ? 'merged by synthesis · not verified yet' : 'as the finders report them',
      total > findings.length ? `the first ${findings.length}` : ''].filter(Boolean).join(' · ');
    const right = `<h2 class="sect">Findings <span class="count">${total}</span><span class="aside">${esc(aside)}</span></h2>` +
      sevChips(live.counts) + (findings.length ? findingList(r, findings) : '<p class="empty">No findings yet.</p>') +
      droppedList(r, live.dropped_total);
    return band('', '▸', text, fresh(r), start) + staleLine(r) + stageSteps(live) +
      `<div class="cols"><div>${agentList(live)}</div><div>${right}</div></div>` + paths(r, true);
  }

  function doneView(r) {
    const verdict = String(r.verdict || 'done'), clean = verdict === 'clean';
    const took = r.duration != null ? num(r.duration) : num(r.finished) && num(r.started) ? num(r.finished) - num(r.started) : null;
    const findings = list(r.findings).filter(obj), questions = list(r.questions).filter(obj), degraded = list(r.degraded);
    // as review.md marks them: not gating or deferred with the reason the run gave, else unresolved
    const marks = {};
    list(r.not_gating).filter(obj).forEach(x => { marks[x.id] = `not gating: ${x.reason || ''}`; });
    list(r.deferred).filter(obj).forEach(x => { marks[x.id] = `deferred: ${x.reason || ''}`; });
    findings.forEach(f => { if (GATING.includes(f.severity) && !marks[f.id]) marks[f.id] = 'unresolved'; });
    const asked = questions.length ? `<span class="sev minor">${questions.length} open</span>` : '';
    return band(clean ? 'done' : 'warn', clean ? '✓' : '!',
      `Round ${esc(r.round)} · ${esc(verdict)}${r.confirming ? ' · confirming round' : ''}`,
      took != null ? `<span class="clock">${fmtDur(took)}</span>` : '') +
      (degraded.length ? `<p class="warnline">Degraded sources: ${esc(degraded.join(', '))}</p>` : '') +
      `<h2 class="sect">Findings <span class="count">${findings.length}</span><span class="aside">the recorded result</span></h2>` +
      sevChips(r.counts, asked) + (findings.length ? findingList(r, findings, marks) : '<p class="empty">No findings.</p>') +
      (questions.length ? `<h2 class="sect">Open questions <span class="count">${questions.length}</span></h2>` +
        questions.map(q => findingView(r, q, 'q')).join('') : '') +
      droppedList(r, 0) + paths(r, false);
  }

  function failedView(r) {
    const seen = r.milestone && r.milestone !== 'failed' ? ` · last seen at ${esc(r.milestone)}` : '';
    return band('error', '✕', `Round ${esc(r.round)} · no result${seen}`) +
      '<p class="empty">No result was recorded for this round: revmux ended without a report, a later round ' +
      'replaced it, or the run ended.</p>' + droppedList(r, 0) + paths(r, false);
  }

  function reviewView(p) {
    const rs = roundList(p);
    if (!rs.length) return '<p class="empty">No review round yet.</p>';
    const r = pickRound(rs), st = roundStatus(r);
    return `<div class="rounds">${rs.map(x => roundChip(x, x === r)).join('')}</div>` +
      (st === 'running' ? runningView(r) : st === 'done' ? doneView(r) : failedView(r));
  }

  const RENDER = {
    design: docView,
    stats: docView,
    plan: planView,
    progress: progressView,
    review: reviewView,
  };

  function notYet() {
    const a = artifact(cur);
    return `<p class="empty">${esc(LABEL[cur])}: not yet${a && a.hint ? ` · <code>${esc(a.hint)}</code>` : ''}</p>`;
  }

  // what a tab shows besides its payload: the Plan tab's rows come from the state's tasks
  const ALSO = {
    plan: () => {
      const a = artifact('plan');
      return JSON.stringify([list(state && state.tasks), (a && (a.hint || a.source)) || null, (state && state.finished) || null]);
    },
    progress: () => filter,
    // the round shown, whether the run ended, and whether the live round went quiet (time alone flips it)
    review: () => {
      const rs = roundList(payloads.review), r = rs.length ? pickRound(rs) : null;
      return JSON.stringify(r ? [r.round, roundStatus(r), stale(r)] : []);
    },
  };

  // rewrite the pane when what it shows changed, keeping the scroll position (or moving to `y`)
  function renderPane(y) {
    const p = payloads[cur];
    const what = p ? `u${p.updated}|${ALSO[cur] ? ALSO[cur]() : ''}`
      : missing.has(cur) || (state && !artifact(cur)) ? 'none' : 'wait';
    if (`${cur}|${what}` === shown) return;
    const keep = y != null ? y : window.scrollY;
    shown = `${cur}|${what}`;
    pane.innerHTML = p ? RENDER[cur](p) : what === 'none' ? notYet() : '<p class="empty">Loading…</p>';
    window.scrollTo(0, keep);
  }

  function setTitle() {
    document.title = `make-task · ${LABEL[cur]}` + (state && state.title ? ` · ${state.title}` : '');
  }

  function show(id) {
    if (!LABEL[id] || id === cur) return;
    scrolls[cur] = window.scrollY;
    cur = id;
    renderHead();
    renderPane(scrolls[id] || 0);
    setTitle();
    loadArtifact(id);
  }

  app.addEventListener('click', e => {
    const tab = e.target.closest('[data-show]');
    if (tab) { show(tab.dataset.show); return; }
    const f = e.target.closest('[data-fold]');
    if (f) {
      // toggled here, not by the browser, so the state is ours and a re-render renders it
      e.preventDefault();
      const key = `${cur}:${f.dataset.fold}`;
      open.set(key, !isOpen(key));
      const d = f.closest('details');
      if (d) d.open = isOpen(key);
      return;
    }
    const chip = e.target.closest('[data-filter]');
    if (chip) {
      if (FILTERS.some(([k]) => k === chip.dataset.filter)) { filter = chip.dataset.filter; renderPane(); }
      return;
    }
    const pick = e.target.closest('[data-round]');
    if (pick) {
      // the followed round unpins, any other round stays shown until then
      const rs = roundList(payloads.review), n = Number(pick.dataset.round);
      if (rs.some(r => r.round === n)) { pinned = n === followed(rs) ? null : n; renderPane(); }
      return;
    }
    // in-page links (the table of contents, footnotes) scroll; the page never navigates
    const link = e.target.closest('a[href^="#"]');
    if (link) {
      e.preventDefault();
      let id = link.getAttribute('href').slice(1);
      try { id = decodeURIComponent(id); } catch (err) { /* keep it as written */ }
      const el = id && document.getElementById(id);
      if (el) el.scrollIntoView({ block: 'start' });
    }
  });

  function tick() {
    const now = nowSec();
    document.querySelectorAll('[data-since]').forEach(el => { el.textContent = fmtDur(now - Number(el.dataset.since)); });
    document.querySelectorAll('[data-ago]').forEach(el => { el.textContent = ago(Number(el.dataset.ago)); });
    if (cur === 'review') renderPane();  // the live round's stale warning comes with time, not with data
  }

  window.mtState = function (next) {
    const txt = JSON.stringify(next);
    if (txt === stateText) return;
    stateText = txt;
    state = next;
    renderHead();
    renderPane();
    setTitle();
  };
  window.mtArtifact = function (id, payload) {
    if (!LABEL[id] || !payload || typeof payload !== 'object') return;
    missing.delete(id);
    const old = payloads[id];
    if (old && old.updated === payload.updated) return;
    payloads[id] = payload;
    if (id === cur) renderPane();
  };

  function load(src, failed) {
    const el = document.createElement('script');
    el.src = `${src}?${Date.now()}`;
    el.onload = () => el.remove();
    el.onerror = () => { el.remove(); failed(); };
    document.head.appendChild(el);
  }
  function loadArtifact(id) {
    load(`artifacts/${id}.js`, () => {
      if (payloads[id] || missing.has(id)) return;
      missing.add(id);
      if (id === cur) renderPane();
    });
  }
  function poll() {
    load('state.js', () => {
      if (state || stateNote === 'state.js not loading') return;
      stateNote = 'state.js not loading';
      renderHead();
    });
    loadArtifact(cur);
  }

  renderHead(); renderPane(); setTitle();
  poll(); setInterval(poll, 1500); setInterval(tick, 1000);
})();
</script>
</body>
</html>
