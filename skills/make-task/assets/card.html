<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!--
  make-task question card. `mt ask` fills the title placeholder (unique per card, used to find this
  page's entry in `agterm.request('tree')`) and the card placeholder in the application/json script
  (the card JSON, with every <, > and & written as a \u escape).
  The card JSON: {n, from, run_title, title, context_html, options: [{id, label, pro, con,
  recommended}], allow_other}. context_html is markdown-it output with raw HTML disabled; every other
  string is escaped here. The page submits JSON.stringify({choice: id} | {choice: 'other', text} |
  {choice: 'delegate'}) through session.overlay.submit; Esc / ⌘W dismiss it (mt falls back to the
  terminal). Colors come only from the --agterm-* variables agterm injects.
-->
<style>
  .card {
    --bg: var(--agterm-background, #1d2021);
    --fg: var(--agterm-foreground, #ebdbb2);
    --dim: color-mix(in srgb, var(--fg) 58%, transparent);
    --faint: color-mix(in srgb, var(--fg) 14%, transparent);
    --wash: color-mix(in srgb, var(--fg) 5%, transparent);
    --run: var(--agterm-color-4, #83a598);
    --ok: var(--agterm-color-2, #b8bb26);
    --bad: var(--agterm-color-1, #fb4934);
    --you: var(--agterm-color-5, #d3869b);
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--agterm-background, #1d2021);
    color: var(--agterm-foreground, #ebdbb2);
    font: 10.5px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { padding: 13.5px 17px 12px; }
  .from { display: flex; gap: 8.5px; align-items: center; color: var(--dim); font-size: 10px; }
  .from .who { color: var(--you); font-weight: 600; }
  .from .of { margin-left: auto; }
  h1 { font: 600 13.5px/1.3 -apple-system, "SF Pro Display", system-ui, sans-serif; letter-spacing: -0.01em; margin: 5px 0 5px; }
  .context { color: color-mix(in srgb, var(--fg) 82%, transparent); max-width: 78ch; margin: 0 0 10px; }
  .context p, .context ul, .context ol, .context pre { margin: 0 0 5px; }
  .context ul, .context ol { padding-left: 17px; }
  .context code { font-family: var(--mono); font-size: 10px; background: var(--wash); padding: 1px 4px; border-radius: 3.5px; }
  .context pre { background: var(--wash); padding: 5px 7px; border-radius: 5px; overflow-x: auto; }
  .context pre code { background: none; padding: 0; }
  .context a { color: var(--run); }

  .options { display: grid; gap: 4px; margin: 0; padding: 0; border: 0; }
  /* one row per option: key | label | what you gain | what it costs */
  .opt {
    display: grid; grid-template-columns: 17px minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); gap: 2px 12px;
    align-items: start; padding: 6px 8.5px; border-radius: 6px;
    border: 1px solid var(--faint); cursor: pointer; position: relative;
  }
  .opt.other { grid-template-columns: 17px minmax(0, 1.15fr) minmax(0, 2fr); }
  @media (max-width: 560px) {
    .opt, .opt.other { grid-template-columns: 17px 1fr; }
    .opt > :not(.key):not(input) { grid-column: 2; }
  }
  .opt:hover { background: var(--wash); }
  .opt input[type=radio] { position: absolute; opacity: 0; pointer-events: none; }
  .opt:has(input:checked) { border-color: var(--run); background: color-mix(in srgb, var(--run) 9%, transparent); }
  .opt:has(input:focus-visible) { outline: none; }
  .key {
    align-self: start; width: 15.5px; height: 15.5px; border-radius: 3.5px; display: grid; place-items: center;
    font: 600 9.5px var(--mono); border: 1px solid var(--faint); color: var(--dim);
  }
  .opt:has(input:checked) .key { background: var(--run); border-color: var(--run); color: var(--bg); }
  .label { font-weight: 600; font-size: 10.5px; }
  .rec { display: block; font-weight: 500; font-size: 9.5px; color: var(--run); }
  .pro, .con { font-size: 10px; color: color-mix(in srgb, var(--fg) 78%, transparent); padding-left: 11px; text-indent: -11px; }
  .pro::before { content: "+"; color: var(--ok); font-weight: 700; display: inline-block; width: 11px; text-indent: 0; }
  .con::before { content: "−"; color: var(--bad); font-weight: 700; display: inline-block; width: 11px; text-indent: 0; }
  .pro:empty::before, .con:empty::before { content: none; }
  .other input[type=text] {
    width: 100%; font: inherit; color: var(--fg); background: transparent; border: 0;
    border-bottom: 1px solid var(--faint); padding: 2.5px 0; outline: none;
  }
  .other input[type=text]:focus { border-bottom-color: var(--run); }

  .actions { display: flex; align-items: center; gap: 7px; margin-top: 10px; }
  .hint { color: var(--dim); font-size: 9.5px; margin-right: auto; }
  .hint kbd, button kbd { font: 10px var(--mono); opacity: .75; margin-left: 5px; }
  button {
    font: inherit; font-size: 10px; border-radius: 5px; padding: 3.5px 9.5px; cursor: pointer;
    border: 1px solid var(--faint); background: var(--wash); color: var(--fg);
  }
  button.primary { background: var(--run); border-color: var(--run); color: var(--bg); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
  .sent { color: var(--ok); font-size: 11px; }
  .err { color: var(--bad); font-size: 11px; }
</style>
</head>
<body>
<main class="card" id="root"></main>
<script id="card" type="application/json">{{CARD}}</script>
<script>
(function () {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(card) {
    const options = Array.isArray(card.options) ? card.options : [];
    const rows = options.map((o, i) =>
      '<label class="opt"><input type="radio" name="c" value="' + esc(o.id) + '"' + (o.recommended ? ' checked' : '') + '>' +
      '<span class="key">' + (i + 1) + '</span>' +
      '<span class="label">' + esc(o.label) + (o.recommended ? ' <span class="rec">Recommended</span>' : '') + '</span>' +
      '<span class="pro">' + esc(o.pro) + '</span>' +
      '<span class="con">' + esc(o.con) + '</span></label>');
    if (card.allow_other !== false)
      rows.push('<label class="opt other"><input type="radio" name="c" value="other"><span class="key">' + (options.length + 1) +
        '</span><span class="label">Your own answer</span>' +
        '<input type="text" id="other" placeholder="Type it here" autocomplete="off"></label>');
    return '<div class="from"><span class="who">' + esc(card.from) + '</span><span>' + esc(card.run_title) + '</span>' +
      '<span class="of">question ' + esc(Number(card.n) || '') + '</span></div>' +
      '<h1>' + esc(card.title) + '</h1>' +
      // context_html is markdown-it output with raw HTML disabled (mt renders it)
      '<div class="context">' + String(card.context_html || '') + '</div>' +
      '<form id="f"><fieldset class="options">' + rows.join('') + '</fieldset>' +
      '<div class="actions"><span class="hint" id="status">Esc asks in the terminal instead</span>' +
      '<button type="button" id="delegate">Decide for me<kbd>D</kbd></button>' +
      '<button type="submit" class="primary" id="answer">Answer<kbd>↵</kbd></button></div></form>';
  }

  // the answer for a picked radio value and the free-text field, or null when there is nothing to send yet
  function answerFor(picked, otherText) {
    if (picked == null) return null;
    if (picked === 'other') {
      const text = String(otherText || '').trim();
      return text ? { choice: 'other', text } : null;
    }
    return { choice: String(picked) };
  }

  // submit the answer; resolves when agterm took it, rejects when it did not
  function send(answer) {
    const value = JSON.stringify(answer);
    if (!window.agterm) return Promise.resolve(null);
    return Promise.resolve(agterm.request('session.overlay.submit', { args: { value } })).then(reply => {
      if (reply && reply.ok === false) throw new Error(String(reply.error || 'submit refused'));
      return reply;
    });
  }

  window.mtCard = { render, answerFor, send };

  const card = JSON.parse(document.getElementById('card').textContent);
  document.getElementById('root').innerHTML = render(card);

  const form = document.getElementById('f');
  const other = document.getElementById('other');
  const radios = [...form.querySelectorAll('input[type=radio]')];
  const status = document.getElementById('status');
  const buttons = [document.getElementById('delegate'), document.getElementById('answer')].filter(Boolean);
  function show(text, cls, busy) {
    buttons.forEach(b => { b.disabled = busy; });
    if (status) { status.textContent = text; status.className = cls; }
  }
  // one answer at a time; a failed submit re-enables the card so the user can send again
  let sent = false;
  function once(answer) {
    if (sent) return;
    sent = true;
    show('Sending…', 'hint', true);
    let p;
    try { p = send(answer); } catch (e) { p = Promise.reject(e); }
    p.then(() => show('Answer sent', 'sent', true),
           () => { sent = false; show('Could not send the answer; try again', 'err', false); });
  }
  function answer() {
    const pick = radios.find(r => r.checked);
    const a = answerFor(pick ? pick.value : null, other ? other.value : '');
    if (a) once(a);
    else if (pick && pick.value === 'other' && other) other.focus();
  }

  form.addEventListener('submit', e => { e.preventDefault(); answer(); });
  document.getElementById('delegate').addEventListener('click', () => once({ choice: 'delegate' }));
  if (other) other.addEventListener('focus', () => { radios[radios.length - 1].checked = true; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return;                    // agterm dismisses; mt falls back to the terminal
    if (e.metaKey || e.ctrlKey || e.altKey) return;    // ⌘D, ⌘1 … belong to agterm and macOS
    if (other && e.target === other) return;
    const onButton = !!(e.target && e.target.tagName === 'BUTTON');
    const i = Number(e.key) - 1;
    if (/^[1-9]$/.test(e.key) && i < radios.length) {
      radios[i].checked = true; radios[i].focus();
      if (radios[i].value === 'other' && other) other.focus();
      e.preventDefault();
    } else if (e.key === 'd' || e.key === 'D') { e.preventDefault(); once({ choice: 'delegate' }); }
    else if (e.key === 'Enter' && !onButton) { e.preventDefault(); answer(); }  // a focused button acts itself
  });
  const first = radios.find(r => r.checked) || radios[0];
  if (first) first.focus();

  // fit the floating panel's height to the card: content height in CSS px times the page zoom agterm reports
  async function fit() {
    if (!window.agterm) return;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    // a page opened without --cwd is loaded from text, so location is not the file: find our entry by title
    let zoom = null;
    try {
      (function walk(o) {
        if (Array.isArray(o)) return o.forEach(walk);
        if (!o || typeof o !== 'object') return;
        for (const p of o.htmlOverlays || [])
          if (p && !p.pane && p.title === document.title) zoom = p.zoom || 1;
        Object.values(o).forEach(walk);
      })(await agterm.request('tree'));
    } catch (e) {}
    if (!zoom) return;                                 // unknown zoom: keep agterm's size, the page scrolls
    const h = Math.ceil(document.getElementById('root').offsetHeight * zoom) + 4;
    try { await agterm.request('session.overlay.resize', { args: { height: h } }); } catch (e) {}
  }
  fit();
})();
</script>
</body>
</html>
